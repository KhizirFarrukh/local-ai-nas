# local-ai-nas REST API contract (ADR-0002, docs/api/conventions.md). The Go
# server interfaces and types are generated from this file with oapi-codegen.
# OpenAPI 3.0.3 because oapi-codegen v2 targets OpenAPI 3.0.x.
openapi: 3.0.3
info:
  title: local-ai-nas API
  version: 0.1.0
  description: |
    The REST API of local-ai-nas. Every endpoint is under `/api/v1`
    (docs/api/versioning.md). Every error is an RFC 9457 problem
    (`application/problem+json`, schema `Problem`, docs/api/errors.md).
    Paths of files and folders go in query parameters or body fields and
    start with `/`, the caller's own storage area.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api/v1
tags:
  - name: system
    description: Server status.
  - name: files
    description: The files area of the caller's storage.
  - name: photos
    description: Reserved for the photos area (stage S04).
paths:
  /files/content:
    get:
      tags: [files]
      operationId: downloadFile
      summary: Download a file
      description: |
        Sends the content of the file at `path` (HEAD sends the headers
        only). Supports byte ranges (`Range`, single and multiple, `If-Range`)
        and conditional requests with the `ETag` and `Last-Modified` values
        (`If-None-Match`, `If-Modified-Since`, `If-Match`,
        `If-Unmodified-Since`). The body's Content-Type is the file's media
        type. `Content-Disposition` is always `attachment`, with the name
        as an ASCII `filename` and the exact UTF-8 name as `filename*`
        (RFC 6266, RFC 8187). Folders and links are refused (400).
      parameters:
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: The whole file.
          headers:
            ETag:
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "206":
          description: The requested ranges (one range, or `multipart/byteranges`).
          headers:
            Content-Range:
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "304":
          description: Not modified (`If-None-Match` or `If-Modified-Since`).
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [files]
      operationId: uploadFile
      summary: Upload a file (simple, streamed)
      description: |
        Writes the request body to the file at `path`. The body is the raw
        file content; its Content-Type is not used. `Content-Length` is
        required (411 without it): the size is checked against the upload
        limit (413) and the free space (507) before anything is stored.
        The bytes go to a hidden temporary file in the target folder,
        which is synced and then renamed in one step, so the file never
        appears partly written. When the name is taken, `on_conflict`
        decides: `fail` (409, before the body is read), `rename`
        (`name (1).ext`, ...), or `overwrite`, which replaces a file
        atomically (200) and never a folder (409). For large files, prefer
        the resumable tus upload.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: on_conflict
          in: query
          schema:
            $ref: "#/components/schemas/OnConflict"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: A new file was created (also with `on_conflict=rename`; the item shows the name used).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileItem"
        "200":
          description: An existing file was replaced (`on_conflict=overwrite`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "411":
          $ref: "#/components/responses/LengthRequired"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  /files/folders:
    post:
      tags: [files]
      operationId: createFolder
      summary: Create a folder
      description: |
        Creates the folder at `path`. With `parents`, missing parent folders
        are created too. When the name is taken, `on_conflict` decides:
        `fail` (409), `rename` (`name (1)`, `name (2)`, ...), or `overwrite`,
        which returns an existing folder unchanged (200) and never replaces
        a file (409). Every new name must follow the name rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "201":
          description: The folder was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileItem"
        "200":
          description: The folder already existed (`on_conflict=overwrite`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /files/items:
    get:
      tags: [files]
      operationId: getItems
      summary: List a folder, or get the details of a file
      description: |
        For a folder, returns the folder and one page of its items, sorted
        and paged as described in docs/api/conventions.md. For a file,
        returns only the file (the paging parameters do not apply).
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page. Only valid with the same sort and order.
          schema:
            type: string
        - name: limit
          in: query
          description: The page size.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/ListSort"
        - name: order
          in: query
          schema:
            $ref: "#/components/schemas/ListOrder"
      responses:
        "200":
          description: The item, and for a folder one page of its items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /system/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Server health and startup checks
      description: |
        Runs the health checks (config, storage_writable, same_filesystem,
        free_space, database). A warning keeps the status 200; a failed
        check gives 503 with the same report body.
      responses:
        "200":
          description: Healthy, possibly with warnings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        "503":
          description: At least one check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /photos:
    get:
      tags: [photos]
      operationId: getPhotos
      summary: Reserved for the photos area
      description: |
        The photos area has no API before the media stages. This path and
        every path under `/photos/`, with any method, answer
        `501 not_available`.
      responses:
        "501":
          $ref: "#/components/responses/NotAvailable"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    Path:
      name: path
      in: query
      required: true
      description: A path in the caller's files area, starting with `/` (the root of the area). See docs/api/conventions.md.
      schema:
        type: string
      example: /docs/report.pdf
  schemas:
    FileItem:
      type: object
      additionalProperties: false
      required: [path, name, kind, size, mod_time]
      properties:
        path:
          type: string
          description: The item's path in the caller's files area, starting with `/`.
        name:
          type: string
          description: The last element of the path; empty for the root.
        kind:
          $ref: "#/components/schemas/ItemKind"
        size:
          type: integer
          format: int64
          description: The size in bytes (0 for folders).
        mod_time:
          type: string
          format: date-time
          description: The last modification time, in UTC.
        mime:
          type: string
          description: |
            The media type of a file. In a listing it comes from the file
            name's extension only (absent when unknown); for a single file it
            falls back to sniffing the first 512 bytes.
        etag:
          type: string
          description: |
            A strong entity tag of the file's current version (only for a
            single file, not in listings). It changes when the file is
            written or replaced; the download sends the same value.
    ItemKind:
      type: string
      description: A symbolic link is listed but never followed.
      enum: [file, dir, symlink, other]
    ItemsResponse:
      type: object
      additionalProperties: false
      required: [item]
      properties:
        item:
          $ref: "#/components/schemas/FileItem"
        items:
          type: array
          description: For a folder, this page of its items.
          items:
            $ref: "#/components/schemas/FileItem"
        next_cursor:
          type: string
          description: Present when more items follow; pass it as `cursor` to get the next page.
    CreateFolderRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string
          description: The folder to create, starting with `/`.
        parents:
          type: boolean
          default: false
          description: Also create missing parent folders.
        on_conflict:
          $ref: "#/components/schemas/OnConflict"
    OnConflict:
      type: string
      enum: [fail, rename, overwrite]
      default: fail
    ListSort:
      type: string
      enum: [name, size, mod_time, kind]
      default: name
    ListOrder:
      type: string
      enum: [asc, desc]
      default: asc
    Problem:
      type: object
      description: An RFC 9457 problem details object (docs/api/errors.md).
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: Always `about:blank` for now; `title` is then the HTTP status text.
          enum: ["about:blank"]
        title:
          type: string
          description: The HTTP status text.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The HTTP status code, equal to the response status.
        detail:
          type: string
          description: A human-readable explanation for this occurrence.
        code:
          type: string
          description: A stable, machine-readable error code.
          enum:
            - internal
            - invalid_request
            - invalid_name
            - outside_root
            - not_found
            - conflict
            - too_large
            - insufficient_storage
            - not_available
            - method_not_allowed
            - length_required
            - precondition_failed
            - range_not_satisfiable
        rule:
          type: string
          description: The exact rule that was broken, for some codes (for example `reserved_name` for `invalid_name`).
        correlation_id:
          type: string
          description: The request ID; the same as the `X-Request-ID` header and the server logs.
    HealthReport:
      type: object
      additionalProperties: false
      required: [status, version, checks]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        version:
          type: string
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"
    HealthCheck:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          description: config, storage_writable, same_filesystem, free_space, or database.
        status:
          $ref: "#/components/schemas/HealthStatus"
        detail:
          type: string
        error:
          type: string
    HealthStatus:
      type: string
      enum: [ok, warn, fail]
  responses:
    BadRequest:
      description: The request is not valid (`invalid_request`, `invalid_name`, or `outside_root`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No endpoint at this path (`not_found`), or no such item.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MethodNotAllowed:
      description: The endpoint exists but not with this method (`method_not_allowed`). The `Allow` header lists the methods.
      headers:
        Allow:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The target already exists, or a parent is not a folder (`conflict`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    LengthRequired:
      description: The upload has no `Content-Length` header (`length_required`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: A condition of the request does not hold (`precondition_failed`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RangeNotSatisfiable:
      description: The range is outside the file (`range_not_satisfiable`); `Content-Range` gives the size.
      headers:
        Content-Range:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooLarge:
      description: The request is over a size limit (`too_large`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotAvailable:
      description: The feature is part of the API but not available yet (`not_available`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InsufficientStorage:
      description: The write would use the free space kept in reserve (`insufficient_storage`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: An unexpected server error (`internal`); the details are in the server log under the correlation ID.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

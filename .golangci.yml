# golangci-lint v2 configuration (ADR-0005). The pinned binary is installed
# with scripts/install-golangci-lint.sh.
version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    depguard:
      # Area separation (invariant I1): the files area and the photos area
      # never import each other. Content moves between them only through
      # internal/transfer (S04.6).
      rules:
        files-area:
          files:
            - "**/internal/files/**"
          deny:
            - pkg: github.com/KhizirFarrukh/local-ai-nas/internal/photos
              desc: the files area must not import the photos area (I1); use internal/transfer
        photos-area:
          files:
            - "**/internal/photos/**"
          deny:
            - pkg: github.com/KhizirFarrukh/local-ai-nas/internal/files
              desc: the photos area must not import the files area (I1); use internal/transfer
        api-no-disk:
          # The API layer reaches files only through files.Service (S01.3-T01).
          # Tests may read the spec and the sources from disk.
          files:
            - "**/internal/api/**"
            - "!$test"
          deny:
            - pkg: os
              desc: the API reaches the disk only through files.Service
            - pkg: path/filepath
              desc: the API reaches the disk only through files.Service
            - pkg: io/ioutil
              desc: the API reaches the disk only through files.Service
            - pkg: syscall
              desc: the API reaches the disk only through files.Service
            - pkg: golang.org/x/sys
              desc: the API reaches the disk only through files.Service
  exclusions:
    rules:
      # Tests build hostile inputs and temporary files on purpose, which
      # gosec reports as unsafe. Production code is always checked.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/KhizirFarrukh/local-ai-nas

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

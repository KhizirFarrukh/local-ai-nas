# pnpm settings for the web UI (S02.1-T01).
#
# pnpm refuses package versions published less than a day ago (its
# minimum release age, a supply-chain guard). The versions below were that
# new when S02 pinned them (checked on the npm registry, 2026-09-25), so
# they are excluded by name. Remove an entry once it is older than the
# limit.
minimumReleaseAgeExclude:
  - vite@8.3.1
  - '@lucide/svelte@1.48.0'

# pnpm audit (CI, S02.1-T05) ignores these advisories, each checked:
# - GHSA-pxg6-pf52-xh8x (low): cookie below 0.7.0 accepts out-of-bounds
#   characters. @sveltejs/kit uses cookie only in its server runtime, which
#   the static single-page build does not ship (cookie's code is not in
#   web/build; checked 2026-09-25). Remove when kit moves to cookie 0.7.
auditConfig:
  ignoreGhsas:
    - GHSA-pxg6-pf52-xh8x

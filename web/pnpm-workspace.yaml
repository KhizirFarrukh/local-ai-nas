# pnpm settings for the web UI (S02.1-T01).
#
# pnpm refuses package versions published less than a day ago (its
# minimum release age, a supply-chain guard). The versions below were that
# new when S02 pinned them (checked on the npm registry, 2026-09-25), so
# they are excluded by name. Remove an entry once it is older than the
# limit.
minimumReleaseAgeExclude:
  - vite@8.3.1
  - '@lucide/svelte@1.48.0'

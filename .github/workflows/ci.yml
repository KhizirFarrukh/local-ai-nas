# Continuous integration (ADR-0005, S01.1-T05). Runs on pull requests into
# develop and main, and on pushes to working branches, because finished
# branches are merged into develop by the agent without always opening a PR.
name: CI

on:
  push:
    branches: [develop, main, "feat/**", "fix/**", "docs/**", "chore/**"]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint run
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
      - name: golangci-lint fmt
        run: golangci-lint fmt --diff

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test (race detector)
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: go test
        if: runner.os != 'Linux'
        run: go test ./...
      - name: Coverage gate (internal/..., minimum 80%)
        if: runner.os == 'Linux'
        run: bash scripts/coverage.sh
      - name: Quick start from the README (fresh clone)
        shell: bash
        run: |
          go run ./cmd/local-ai-nas serve --storage-root "$PWD/dev/data" > quickstart.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/api/v1/system/health; then
              exit 0
            fi
            sleep 2
          done
          cat quickstart.log
          exit 1

  memory:
    # S01.4-T04: the heap stays under 256 MiB while large files are
    # uploaded (simple and tus), copied, and downloaded. The uploads and
    # the copy write real bytes, so the job prints the free disk first.
    name: Memory bound (${{ matrix.os }}, ${{ matrix.size }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, size: 10GiB }
          - { os: windows-latest, size: 1GiB } # sparse files differ on Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Free disk
        shell: bash
        run: df -h . "${RUNNER_TEMP}" || true
      - name: go test -run TestMemoryBound
        shell: bash
        env:
          LOCALAINAS_MEMTEST_SIZE: ${{ matrix.size }}
        run: go test -count=1 -timeout 25m -run TestMemoryBound -v ./internal/api

  demo:
    # S01.7-T06: the demo scripts against a fresh server, as a user runs
    # them: demo.sh on Linux, demo.ps1 in Windows PowerShell 5.1. The job
    # also fails if the server logged an error during the demo.
    name: Demo (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Start a fresh server and run the demo
        shell: bash
        run: |
          go build -o "bin/local-ai-nas$(go env GOEXE)" ./cmd/local-ai-nas
          "bin/local-ai-nas$(go env GOEXE)" serve --storage-root "$PWD/dev/demo" > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/api/v1/system/health && break
            sleep 1
          done
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/demo.ps1
          else
            scripts/demo.sh
          fi
      - name: The server logged no error
        if: always()
        shell: bash
        run: |
          cat server.log
          ! grep -q '"level":"ERROR"' server.log

  checks:
    name: Vulnerabilities, licenses, generated code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go tool govulncheck ./...
      - name: Dependency licenses
        run: bash scripts/check-licenses.sh
      - name: Generated code is up to date
        run: |
          go generate ./...
          git status --porcelain
          test -z "$(git status --porcelain)"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: go build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = windows ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-X main.version=${GITHUB_SHA::12}" \
            -o "dist/local-ai-nas-${GOOS}-${GOARCH}${ext}" ./cmd/local-ai-nas
          ls -l dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: local-ai-nas-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  image:
    name: Dev image (build, run, compose, scan)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build the runtime image
        run: >
          docker buildx build --load
          -f deploy/Dockerfile.dev --target runtime
          --build-arg VERSION=${GITHUB_SHA::12}
          -t local-ai-nas:ci .
      - name: Run the runtime image and check health
        run: |
          docker run -d --name nas -p 127.0.0.1:8080:8080 \
            -e LOCALAINAS_SERVER_BIND=0.0.0.0:8080 -e LOCALAINAS_SERVER_ALLOW_CONTAINER_BIND=true local-ai-nas:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/system/health; then
              docker rm -f nas >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs nas
          exit 1
      - name: Start the compose dev environment and check health
        run: |
          docker compose -f deploy/compose.dev.yaml up -d --build
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/api/v1/system/health; then
              docker compose -f deploy/compose.dev.yaml down -v
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/compose.dev.yaml logs
          docker compose -f deploy/compose.dev.yaml down -v
          exit 1
      - name: Scan the runtime image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: local-ai-nas:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

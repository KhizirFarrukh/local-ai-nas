# Dependency update pull requests (ADR-0005). They target develop, like all
# work.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

  # Base images in deploy/Dockerfile.dev (S01.1-T06).
  - package-ecosystem: docker
    directory: /deploy
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
